<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mister Qowa">
  <!--
    LE MASKABLE, ET POURQUOI CE N'EST PAS `icon.svg` EN PLUS PETIT.

    Le PNG livré jusqu'ici sortait du générateur du socle en mode maskable avec
    un fond `15,10,30` — un quasi-noir choisi pour le thème sombre de l'app, pas
    pour la tuile. La tuile violette était donc réduite au milieu de ce noir, et
    le raccord se voyait : mesuré, le coin rendait rgb(15,10,30) quand
    l'intérieur rendait rgb(111,50,213). Choisir la couleur de l'aplat rapproche
    les deux teintes ; ça ne supprime jamais le raccord.

    DEUX DIFFÉRENCES AVEC LA SOURCE, ET DEUX SEULEMENT :

      1. LE FOND N'A PLUS DE COINS. `rx="112"` disparaît : le dégradé occupe la
         toile entière, donc il n'y a plus de bord à raccorder quel que soit le
         masque de l'appareil. C'est le MÊME dégradé, aux mêmes arrêts.

      2. LE DESSIN EST RECENTRÉ, de neuf pixels et demi vers le haut. Il penchait
         vers le bas à cause de la queue de la bulle. Il n'est PAS réduit : la
         mesure dit qu'il atteint 173,1 px pour une zone de sécurité à 204,8, et
         le rétrécir lui ferait perdre de la présence sans rien protéger.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#4c1d95" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)" />
  <g transform="translate(0.5 -9.5)" fill="#fff">
    <path d="M256 120c-83 0-150 60-150 134 0 47 27 89 70 114l-14 44 58-32c12 2 24 3 36 3 83 0 150-60 150-132S339 120 256 120z" opacity=".15" />
    <text x="256" y="320" font-family="Fredoka, system-ui, sans-serif" font-size="220" font-weight="700" text-anchor="middle">?</text>
  </g>
</svg>
