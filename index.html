<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="Créez un quiz par IA ou à partir d'un texte, puis animez-le en direct : les joueurs rejoignent par QR code ou code PIN et répondent sur leur téléphone."
    />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mister Qowa — créer et jouer des quiz en direct</title>
    <!-- SEO/partage : __SEO_HOME_URL__ et __SEO_LOGO_URL__ sont remplis au
         build par pwaSeoPlugin() (vite.config.ts). -->
    <link rel="canonical" href="__SEO_HOME_URL__" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Mister Qowa — créer et jouer des quiz en direct"
    />
    <meta
      property="og:description"
      content="Créez un quiz par IA ou à partir d'un texte, puis animez-le en direct : les joueurs rejoignent par QR code ou code PIN et répondent sur leur téléphone."
    />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta property="og:image" content="__SEO_LOGO_URL__" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Applique la langue mémorisée AVANT le rendu React (évite le flash de
      // langue / le mauvais `lang` au chargement). Clé persist Zustand.
      try {
        var l = JSON.parse(localStorage.getItem('mister-qowa:lang')).state.lang;
        if (l) document.documentElement.lang = l;
      } catch (e) {
        /* pas de préférence : on garde fr */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
