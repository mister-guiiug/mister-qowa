# Tests des Security Rules sur l'émulateur Firebase : RTDB (modèle anti-triche)
# ET Firestore (droit à l'effacement — chacun efface ses documents, et rien
# d'autre). C'est le SEUL endroit où `firestore.rules` est exécuté : le reste de
# la CI ne fait que le lire.
name: Rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  rules:
    name: Security Rules (émulateurs RTDB + Firestore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: mister-guiiug/dev-pwa-config/.github/actions/setup-pwa@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Les émulateurs RTDB et Firestore (firebase-tools ≥ 15) exigent Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Tests des rules (émulateur)
        run: npm run test:rules
