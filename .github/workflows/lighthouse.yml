# Lighthouse délégué au reusable workflow famille (dev-wpa-config).
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  lighthouse:
    uses: mister-guiiug/dev-wpa-config/.github/workflows/pwa-lighthouse.yml@v3
    secrets: inherit
    with:
      # Le client exige des VITE_FIREBASE_* pour peindre (sinon NO_FCP) :
      # factices, comme pour la CI de mister-puzzle.
      build-env: |
        VITE_PUBLIC_SITE_ORIGIN=https://example.github.io
        VITE_FIREBASE_API_KEY=ci-dummy-key
        VITE_FIREBASE_AUTH_DOMAIN=dummy.firebaseapp.com
        VITE_FIREBASE_DATABASE_URL=https://dummy.firebaseio.com
        VITE_FIREBASE_PROJECT_ID=dummy-ci
        VITE_FIREBASE_STORAGE_BUCKET=dummy.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
        VITE_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000
